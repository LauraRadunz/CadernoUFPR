<title>Caderno de História</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: a single reading column like a folio page, with a ruled margin and gilt headings.
   Palette: vellum ground, iron-gall ink, oxblood accent, verdigris for right, madder for wrong, gilt for rules. */
:root{
  --bg:#dcc592;
  --page:#f6e6bd;
  --ink:#2a2118;
  --ink-soft:#6a5b48;
  --rule:#c2a76c;
  --accent:#7a1f24;
  --accent-ink:#f8efdc;
  --gilt:#a67c2e;
  --ok:#2f5d4b;
  --ok-bg:#dde7d6;
  --bad:#9b2a22;
  --bad-bg:#f0d6cc;
  --sel-bg:#ead39a;
  --font-display:"Cinzel","Trajan Pro","Times New Roman",serif;
  --font-body:"Crimson Pro","Iowan Old Style","Palatino Linotype",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17120d;--page:#211a13;--ink:#eadfc7;--ink-soft:#b3a284;--rule:#4a3d2b;
  --accent:#d9885f;--accent-ink:#1b130c;--gilt:#c9a04c;--ok:#8fc2a6;--ok-bg:#1d2d25;--bad:#e58a7d;--bad-bg:#35201b;--sel-bg:#3a2e1d;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17120d;--page:#211a13;--ink:#eadfc7;--ink-soft:#b3a284;--rule:#4a3d2b;
  --accent:#d9885f;--accent-ink:#1b130c;--gilt:#c9a04c;--ok:#8fc2a6;--ok-bg:#1d2d25;--bad:#e58a7d;--bad-bg:#35201b;--sel-bg:#3a2e1d;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1.15rem;line-height:1.55;padding-inline:16px;padding-block:20px 56px}
.wrap{max-width:46rem;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.82rem;color:var(--accent);background:none;border:0;padding:6px 0;cursor:pointer}
.tools{display:flex;gap:8px}
.btn{font-family:var(--font-display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:.78rem;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:12px 20px;cursor:pointer;min-height:44px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
:focus-visible{outline:3px solid var(--gilt);outline-offset:2px}
.folio{background:var(--page);border:1px solid var(--rule);box-shadow:0 1px 0 var(--rule),0 12px 30px -18px rgba(0,0,0,.45);padding:clamp(18px,4vw,36px);position:relative}
.folio::before{content:"";position:absolute;inset:6px;border:1px solid var(--rule);pointer-events:none}
.folio>*{position:relative}
.eyebrow{font-family:var(--font-display);letter-spacing:.2em;text-transform:uppercase;font-size:.74rem;color:var(--gilt)}
h1,h2,h3{font-family:var(--font-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(1.8rem,6vw,2.7rem);letter-spacing:.04em}
.lede{color:var(--ink-soft);max-width:34rem;margin:10px 0 0}
.home-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.index{list-style:none;margin:26px 0 0;padding:0;border-top:1px solid var(--rule)}
.index li{border-bottom:1px solid var(--rule)}
.index button{width:100%;display:grid;grid-template-columns:3.6rem 1fr auto;align-items:center;gap:10px;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:12px 4px;cursor:pointer;min-height:48px}
.index button:hover{background:var(--sel-bg)}
.rom{font-family:var(--font-display);font-weight:700;color:var(--accent);font-size:1.15rem;letter-spacing:.04em}
.idx-t{min-width:0}
.idx-meta{font-size:.92rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.idx-meta b{color:var(--ok);font-weight:600}
/* progress */
.prog{display:flex;flex-direction:column;gap:6px}
.prog-row{display:flex;justify-content:space-between;gap:10px;font-family:var(--font-display);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.prog-row span{font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
/* interlude */
.inter{text-align:center;padding-block:clamp(22px,6vw,48px)}
.inter .big{font-family:var(--font-display);font-weight:700;color:var(--accent);font-size:clamp(3.4rem,18vw,7rem);line-height:1;letter-spacing:.06em;margin:14px 0 6px}
.inter h2{font-size:clamp(1.3rem,4.6vw,1.9rem);letter-spacing:.05em}
.orn{display:flex;align-items:center;gap:12px;color:var(--gilt);margin:18px auto;max-width:20rem}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:var(--gilt)}
.orn span{font-size:1.1rem;line-height:1}
.inter .btn{margin-top:8px}
/* question */
.q-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tag{font-family:var(--font-display);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--gilt);color:var(--gilt);padding:3px 9px;white-space:nowrap}
.stem{display:flex;flex-direction:column;gap:12px}
.stem p{margin:0}
.stem .text{margin:0;padding:2px 0 2px 16px;border-left:3px solid var(--gilt);font-size:1.08rem;color:var(--ink)}
.stem .item{margin:0;padding-left:1.4rem;text-indent:-1.4rem}
.stem .src{font-size:.88rem;color:var(--ink-soft);font-style:italic;margin-top:-4px;overflow-wrap:anywhere}
.stem .prompt{font-weight:600}
.fig{margin:0;border:1px solid var(--rule);background:var(--bg);padding:8px;align-self:flex-start;max-width:100%}
.fig img{display:block;max-width:100%;height:auto}
.opts{list-style:none;margin:20px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
.opt{width:100%;display:grid;grid-template-columns:2rem 1fr;gap:10px;align-items:start;text-align:left;font:inherit;color:inherit;background:transparent;border:1.5px solid var(--rule);padding:12px 14px;cursor:pointer;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--gilt);background:var(--sel-bg)}
.opt .l{font-family:var(--font-display);font-weight:700;color:var(--accent);text-transform:uppercase;padding-top:2px}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--accent);background:var(--sel-bg)}
.opt.sel .l{background:var(--accent);color:var(--accent-ink);text-align:center;width:1.7rem;height:1.7rem;line-height:1.7rem;padding:0}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .l{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .l{color:var(--bad)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt .mark{font-family:var(--font-display);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;display:block;margin-top:4px}
.actions{display:flex;justify-content:flex-end;margin-top:20px}
.verdict{margin-top:22px;border:1.5px solid;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.verdict.ok{border-color:var(--ok);background:var(--ok-bg)}
.verdict.no{border-color:var(--bad);background:var(--bad-bg)}
.verdict h3{font-size:1.15rem;letter-spacing:.08em;text-transform:uppercase}
.verdict.ok h3{color:var(--ok)}.verdict.no h3{color:var(--bad)}
.verdict p{margin:0}
.verdict .lab{font-family:var(--font-display);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:2px}
.note{border-top:1px dashed var(--ink-soft);padding-top:10px;font-size:1rem;color:var(--ink-soft)}
/* result */
.res{list-style:none;margin:20px 0 0;padding:0;border-top:1px solid var(--rule)}
.res li{display:grid;grid-template-columns:3.6rem 1fr auto;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--rule)}
.score{font-family:var(--font-display);font-weight:700;font-size:clamp(2.4rem,10vw,4rem);color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.small{font-size:.92rem;color:var(--ink-soft)}
@media (max-width:420px){.index button{grid-template-columns:3rem 1fr auto}.idx-meta{font-size:.82rem}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.tools{flex-wrap:wrap;justify-content:flex-end}
.saved{margin:10px 0 0;max-width:36rem;color:var(--ink)}
.tabs{display:flex;gap:0;margin-top:26px;border-bottom:1px solid var(--rule)}
.tabs button{font-family:var(--font-display);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.8rem;background:none;border:0;border-bottom:3px solid transparent;color:var(--ink-soft);padding:12px 18px;cursor:pointer;min-height:44px;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.cnt{display:inline-block;min-width:1.5rem;padding:0 6px;margin-left:6px;background:var(--bad);color:var(--accent-ink);font-size:.74rem;line-height:1.5rem;text-align:center;border-radius:1rem;letter-spacing:0}
.tabs+.index{margin-top:0;border-top:0}
.empty{margin:22px 0 0;color:var(--ink-soft)}
.index .idx-t{overflow-wrap:anywhere}
.errrow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;border-bottom:1px solid var(--rule)}
.index li.errrow{border-bottom:1px solid var(--rule)}
.errmain{display:grid!important;grid-template-columns:3.2rem 1fr;gap:10px;align-items:start;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:12px 4px;cursor:pointer;min-width:0}
.index .errmain{grid-template-columns:3.2rem 1fr}
.drop{font-family:var(--font-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.68rem;background:transparent;color:var(--ink-soft);border:1px solid var(--rule);padding:8px 10px;min-height:44px;cursor:pointer;max-width:6.5rem}
.drop:hover{border-color:var(--bad);color:var(--bad)}
.chip{display:inline-block;margin-top:4px;font-family:var(--font-display);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;border:1px solid}
.chip.ok{color:var(--ok);border-color:var(--ok)}
.chip.no{color:var(--bad);border-color:var(--bad)}
.verdict .btn.ghost{margin-top:2px}
.index .drop{display:block;width:auto;grid-template-columns:none;font-family:var(--font-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.66rem;line-height:1.3;border:1px solid var(--rule);padding:8px 10px;color:var(--ink-soft);background:transparent;text-align:center}
.index .drop:hover{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.index .errmain:hover{background:var(--sel-bg)}
</style>

<div class="wrap" id="app"></div>

<script id="dados" type="application/json">__DATA__</script>
<script>
(function(){
var D=JSON.parse(document.getElementById('dados').textContent);
var AUL=D.aulas, QS=D.qs, L="abcde";
var KEY="caderno-historia-v1";
var st={view:"home",tab:"aulas",i:0,sel:null,done:false,ans:{},err:{},pos:0,fin:null,mode:"main",queue:[],qp:0,revRight:0,revTotal:0};
try{var s=JSON.parse(localStorage.getItem(KEY)||"null");if(s){if(s.ans)st.ans=s.ans;if(s.err)st.err=s.err;if(typeof s.pos==="number")st.pos=s.pos;if(s.fin)st.fin=s.fin;}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({ans:st.ans,err:st.err,pos:st.pos,fin:st.fin}));}catch(e){}}
var app=document.getElementById('app');
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]});}
function aulaOf(n){return AUL.filter(function(a){return a.n===n})[0];}
function firstIdx(n){for(var k=0;k<QS.length;k++)if(QS[k].aula===n)return k;return 0;}
function posIn(q){return QS.filter(function(x){return x.aula===q.aula}).indexOf(q)+1;}
function stats(n){var t=0,r=0,d=0;QS.forEach(function(q){if(n&&q.aula!==n)return;t++;if(q.id in st.ans){d++;if(st.ans[q.id]===q.ans)r++;}});return{t:t,d:d,r:r};}
function nextOpen(){for(var k=0;k<QS.length;k++)if(!(QS[k].id in st.ans))return k;return -1;}
QS.forEach(function(q){if(q.id in st.ans&&st.ans[q.id]!==q.ans&&!st.err[q.id])st.err[q.id]={w:1,r:0,last:0,at:st.fin};});
function wrongIdx(){var o=[];QS.forEach(function(q,k){if(st.err[q.id])o.push(k);});return o;}
function noteResult(q,ok){var e=st.err[q.id];
  if(!ok){if(!e)e=st.err[q.id]={w:0,r:0,last:0,at:null};e.w++;e.last=0;e.at=new Date().toISOString();}
  else if(e){e.r++;e.last=1;}}
function resumeIdx(){var p=st.pos;if(p>=0&&p<QS.length&&!(QS[p].id in st.ans))return p;return nextOpen();}
function fmt(iso){try{var d=new Date(iso);return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})+" às "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});}catch(e){return "";}}
function label(k){var q=QS[k],a=aulaOf(q.aula);return "Aula "+a.rom+" · questão "+posIn(q);}

function top(){
  var fin=(st.view==="q"||st.view==="inter")?'<button class="btn" data-a="finish">Finalizar estudo</button>':'';
  return '<div class="top"><button class="brand" data-a="home">Caderno de História</button>'+
  '<div class="tools">'+fin+'<button class="btn ghost" data-a="theme" aria-label="Alternar tema claro e escuro">Tema</button></div></div>';
}
function home(){
  var all=stats(0), nx=resumeIdx(), w=wrongIdx();
  var h=top()+'<section class="folio"><div class="eyebrow">Frente II · Aulas I a XIII</div>'+
  '<h1 style="margin-top:8px">Caderno de História</h1>';
  if(st.fin&&all.d>0){
    h+='<p class="saved">Último estudo finalizado em '+fmt(st.fin)+'. '+(nx!==-1?'Você parou em <b>'+label(nx)+'</b>. ':'Você chegou ao fim das questões. ')+(w.length?'Seu caderno de erros tem <b>'+w.length+'</b> '+(w.length===1?'questão':'questões')+'.':'Seu caderno de erros está vazio.')+'</p>';
  }else{
    h+='<p class="lede">Da pré-história à Baixa Idade Média. Responda, confirme e veja se acertou, com a alternativa correta e a explicação. As questões seguem a ordem do material e um aviso marca cada mudança de aula.</p>';
  }
  h+='<div class="home-actions">';
  if(all.d===0)h+='<button class="btn" data-a="go" data-i="0">Começar do início</button>';
  else if(nx!==-1)h+='<button class="btn" data-a="go" data-i="'+nx+'">Continuar de onde parei</button>';
  if(w.length)h+='<button class="btn ghost" data-a="rev">Refazer os '+w.length+' erros</button>';
  if(nx===-1&&all.d>0)h+='<button class="btn ghost" data-a="result">Ver resultado</button>';
  h+='</div>';
  h+='<div class="tabs" role="tablist"><button role="tab" aria-selected="'+(st.tab==="aulas")+'" data-a="tab" data-t="aulas">Aulas</button><button role="tab" aria-selected="'+(st.tab==="rev")+'" data-a="tab" data-t="rev">Erros'+(w.length?' <span class="cnt">'+w.length+'</span>':'')+'</button></div>';
  if(st.tab==="aulas"){
    h+='<ul class="index">';
    AUL.forEach(function(a){var s=stats(a.n);
      h+='<li><button data-a="aula" data-n="'+a.n+'"><span class="rom">'+a.rom+'</span><span class="idx-t">'+esc(a.title)+'</span><span class="idx-meta">'+(s.d?'<b>'+s.r+'</b>/'+s.d+' · ':'')+s.t+' questões</span></button></li>';});
    h+='</ul>';
  }else{
    if(!w.length){
      h+='<p class="empty">'+'Quando você errar uma questão, ela entra aqui e fica guardada, mesmo depois de você acertar. Ela só sai quando você tocar em “Tirar dos erros”.'+'</p>';
    }else{
      h+='<ul class="index">';
      w.forEach(function(k,j){var q=QS[k],a=aulaOf(q.aula),e=st.err[q.id],pr=q.blocks.filter(function(b){return b[0]==="p"}).pop(),t=pr?pr[1]:"";
        if(t.length>90)t=t.slice(0,88)+"…";
        var chip=e.last?'<span class="chip ok">Acertei depois</span>':'<span class="chip no">Ainda erro</span>';
        h+='<li class="errrow"><button class="errmain" data-a="revone" data-j="'+j+'"><span class="rom">'+a.rom+'</span><span class="idx-t"><span class="small">Questão '+posIn(q)+(q.tag?' · '+esc(q.tag):'')+' · errou '+e.w+'x'+(e.r?' · acertou '+e.r+'x depois':'')+'</span><br>'+esc(t)+'<br>'+chip+'</span></button>'+
        '<button class="drop" data-a="drop" data-id="'+q.id+'">Tirar dos erros</button></li>';});
      h+='</ul>';
    }
  }
  h+='</section>';
  app.innerHTML=h;
}
function inter(i){
  var q=QS[i],a=aulaOf(q.aula),s=stats(a.n);
  app.innerHTML=top()+progress(i)+'<section class="folio inter"><div class="eyebrow">Muda o conteúdo</div><div class="big">'+a.rom+'</div>'+
  '<h2>Aula '+String(a.n).padStart(2,"0")+' · '+esc(a.title)+'</h2><div class="orn"><span>❖</span></div>'+
  '<p class="small">'+s.t+' questões nesta aula</p><button class="btn" data-a="start">Começar a aula</button></section>';
  window.scrollTo(0,0);
}
function progress(i){
  var q=QS[i],a=aulaOf(q.aula),all=stats(0);
  if(st.mode==="rev")return '<div class="prog"><div class="prog-row"><span>Revisão dos erros · Aula '+a.rom+'</span><span>'+(st.qp+1)+' / '+st.queue.length+'</span></div><div class="bar"><i style="width:'+((st.qp+(st.done?1:0))/st.queue.length*100)+'%"></i></div></div>';
  return '<div class="prog"><div class="prog-row"><span>Aula '+a.rom+' · '+esc(a.title)+'</span><span>'+all.d+' / '+all.t+'</span></div><div class="bar"><i style="width:'+(all.d/all.t*100)+'%"></i></div></div>';
}
function stem(q){
  var h='<div class="stem">';
  q.blocks.forEach(function(b){
    var c=b[0]==="text"?"text":b[0]==="item"?"item":b[0]==="src"?"src":"";
    h+='<p class="'+c+'">'+esc(b[1])+'</p>';});
  if(q.img)h+='<figure class="fig"><img src="'+q.img+'" alt="'+esc(q.alt||"")+'"></figure>';
  return h+'</div>';
}
function lastInFlow(){return st.mode==="rev"?st.qp+1>=st.queue.length:st.i+1>=QS.length;}
function question(){
  var q=QS[st.i],a=aulaOf(q.aula),pos=posIn(q),cnt=stats(a.n).t;
  var h=top()+progress(st.i)+'<section class="folio"><div class="q-head"><div class="eyebrow">'+(st.mode==="rev"?'Revisão · ':'')+'Questão '+pos+' de '+cnt+' · Aula '+a.rom+'</div>'+(q.tag?'<span class="tag">'+esc(q.tag)+'</span>':'')+'</div>'+stem(q)+'<ul class="opts">';
  q.opts.forEach(function(o,k){
    var c="opt";
    if(st.done){if(k===q.ans)c+=" right";else if(k===st.sel)c+=" wrong";}
    else if(k===st.sel)c+=" sel";
    var m="";
    if(st.done){if(k===q.ans)m='<span class="mark">Resposta correta</span>';else if(k===st.sel)m='<span class="mark">Sua resposta</span>';}
    h+='<li><button class="'+c+'" data-a="opt" data-k="'+k+'"'+(st.done?' disabled':'')+' aria-pressed="'+(k===st.sel)+'"><span class="l">'+L[k]+'</span><span class="t">'+esc(o)+m+'</span></button></li>';});
  h+='</ul>';
  if(!st.done){
    h+='<div class="actions"><button class="btn" data-a="confirm"'+(st.sel===null?' disabled':'')+'>Confirmar resposta</button></div>';
  }else{
    var ok=st.sel===q.ans;
    h+='<div class="verdict '+(ok?'ok':'no')+'" role="status"><h3>'+(ok?'Você acertou':'Você errou')+'</h3>'+
    '<p><span class="lab">Alternativa correta</span><b>'+L[q.ans].toUpperCase()+')</b> '+esc(q.opts[q.ans])+'</p>'+
    '<p><span class="lab">Explicação</span>'+esc(q.ex)+'</p>';
    if(st.err[q.id])h+='<p class="note">Esta questão fica no seu caderno de erros'+(ok?', mesmo acertando agora':'')+'. Ela só sai quando você tocar em “Tirar dos erros”.</p><div><button class="btn ghost" data-a="drop" data-id="'+q.id+'">Tirar dos erros</button></div>';
    if(q.pdf!==undefined)h+='<p class="note">O gabarito do PDF indica a letra '+L[q.pdf].toUpperCase()+' para esta questão, mas a ordem das questões da aula 11 não bate com a do gabarito. A resposta acima é a historicamente correta.</p>';
    h+='</div><div class="actions"><button class="btn" data-a="next">'+(lastInFlow()?'Ver resultado':'Próxima')+'</button></div>';
  }
  h+='</section>';
  app.innerHTML=h;
}
function result(){
  var all=stats(0),w=wrongIdx(),h=top()+'<section class="folio inter"><div class="eyebrow">Resultado</div><div class="score" style="margin-top:12px">'+all.r+' / '+all.d+'</div>'+
  '<p class="small">'+(all.d?Math.round(all.r/all.d*100):0)+'% de acertos em '+all.d+' questões respondidas</p><div class="orn"><span>❖</span></div>'+
  '<ul class="res" style="text-align:left">';
  AUL.forEach(function(a){var s=stats(a.n);h+='<li><span class="rom">'+a.rom+'</span><span>'+esc(a.title)+'</span><span class="idx-meta"><b>'+s.r+'</b>/'+s.d+' de '+s.t+'</span></li>';});
  h+='</ul><div class="home-actions" style="justify-content:center">'+(w.length?'<button class="btn" data-a="rev">Refazer os '+w.length+' erros</button>':'')+'<button class="btn ghost" data-a="home">Índice</button></div></section>';
  app.innerHTML=h;window.scrollTo(0,0);
}
function revResult(){
  var w=wrongIdx();
  app.innerHTML=top()+'<section class="folio inter"><div class="eyebrow">Revisão concluída</div><div class="score" style="margin-top:12px">'+st.revRight+' / '+st.revTotal+'</div>'+
  '<p class="small">'+'Acertos nesta revisão. '+w.length+' '+(w.length===1?'questão segue':'questões seguem')+' no caderno de erros até você tirá-'+(w.length===1?'la':'las')+'.'+'</p><div class="orn"><span>❖</span></div>'+
  '<div class="home-actions" style="justify-content:center">'+(w.length?'<button class="btn" data-a="rev">Refazer os '+w.length+' erros</button>':'')+'<button class="btn ghost" data-a="gorev">Abrir caderno de erros</button><button class="btn ghost" data-a="home">Índice</button></div></section>';
  window.scrollTo(0,0);
}
function finView(){
  var all=stats(0),w=wrongIdx(),nx=resumeIdx();
  app.innerHTML=top()+'<section class="folio inter"><div class="eyebrow">Estudo finalizado</div><div class="score" style="margin-top:12px">'+all.r+' / '+all.d+'</div>'+
  '<p class="small">acertos em '+all.d+' questões respondidas</p><div class="orn"><span>❖</span></div>'+
  '<ul class="res" style="text-align:left"><li><span class="rom">▸</span><span>Onde você parou</span><span class="idx-meta">'+(nx!==-1?label(nx):'fim das questões')+'</span></li>'+
  '<li><span class="rom">✕</span><span>No caderno de erros</span><span class="idx-meta"><b>'+w.length+'</b> '+(w.length===1?'questão':'questões')+'</span></li></ul>'+
  '<p class="small" style="margin-top:14px">Salvo neste navegador. Ao voltar, é só tocar em “Continuar de onde parei” ou abrir a aba Erros.</p>'+
  '<div class="home-actions" style="justify-content:center">'+(w.length?'<button class="btn" data-a="rev">Refazer os erros agora</button>':'')+'<button class="btn ghost" data-a="gorev">Abrir caderno de erros</button><button class="btn ghost" data-a="home">Índice</button></div></section>';
  window.scrollTo(0,0);
}
function render(){
  if(st.view==="home")home();
  else if(st.view==="inter")inter(st.i);
  else if(st.view==="q")question();
  else if(st.view==="result")result();
  else if(st.view==="revres")revResult();
  else if(st.view==="fin")finView();
}
function goto(i,withInter){
  st.mode="main";st.i=i;st.sel=null;st.done=false;
  var q=QS[i];
  var newAula=(i===0||QS[i-1].aula!==q.aula);
  st.view=(withInter&&newAula)?"inter":"q";
  render();window.scrollTo(0,0);
}
function startRev(at){
  var w=wrongIdx();if(!w.length){st.view="home";st.tab="rev";render();return;}
  st.mode="rev";st.queue=w;st.qp=at||0;st.revRight=0;st.revTotal=w.length;
  st.i=w[st.qp];st.sel=null;st.done=false;st.view="q";render();window.scrollTo(0,0);
}
function goHome(tab){st.mode="main";st.view="home";if(tab)st.tab=tab;render();window.scrollTo(0,0);}
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.getAttribute('data-a');
  if(a==="home"){goHome();}
  else if(a==="gorev"){goHome("rev");}
  else if(a==="tab"){st.tab=b.getAttribute('data-t');render();}
  else if(a==="theme"){var r=document.documentElement,cur=r.getAttribute('data-theme');
    var dark=cur?cur==="dark":window.matchMedia('(prefers-color-scheme: dark)').matches;
    r.setAttribute('data-theme',dark?'light':'dark');}
  else if(a==="go"){goto(parseInt(b.getAttribute('data-i'),10),true);}
  else if(a==="aula"){goto(firstIdx(parseInt(b.getAttribute('data-n'),10)),true);}
  else if(a==="start"){st.view="q";render();window.scrollTo(0,0);}
  else if(a==="opt"&&!st.done){st.sel=parseInt(b.getAttribute('data-k'),10);render();}
  else if(a==="confirm"&&st.sel!==null&&!st.done){var q=QS[st.i];st.ans[q.id]=st.sel;st.done=true;noteResult(q,st.sel===q.ans);
    if(st.mode==="rev"){if(st.sel===q.ans)st.revRight++;}else{st.pos=Math.min(st.i+1,QS.length-1);}
    save();render();
    var v=app.querySelector('.verdict');if(v)v.scrollIntoView({block:"nearest",behavior:"smooth"});}
  else if(a==="next"){
    if(st.mode==="rev"){if(st.qp+1>=st.queue.length){st.view="revres";render();}
      else{st.qp++;st.i=st.queue[st.qp];st.sel=null;st.done=false;st.view="q";render();window.scrollTo(0,0);}}
    else{var n=st.i+1<QS.length?st.i+1:-1;if(n===-1){st.view="result";render();}else goto(n,true);}}
  else if(a==="finish"){
    if(st.mode==="main"){st.pos=Math.min(st.done?st.i+1:st.i,QS.length-1);}
    st.fin=new Date().toISOString();save();st.view="fin";render();}
  else if(a==="result"){st.view="result";render();}
  else if(a==="drop"){delete st.err[b.getAttribute('data-id')];save();render();}
  else if(a==="rev"){startRev(0);}
  else if(a==="revone"){startRev(parseInt(b.getAttribute('data-j'),10));}
});
document.addEventListener('keydown',function(e){
  if(st.view!=="q"||e.metaKey||e.ctrlKey||e.altKey)return;
  var q=QS[st.i],k=L.indexOf(e.key.toLowerCase());
  if(!st.done&&k>-1&&k<q.opts.length&&e.key.length===1){st.sel=k;render();}
  else if(e.key==="Enter"&&document.activeElement.tagName!=="BUTTON"){
    if(!st.done&&st.sel!==null)app.querySelector('[data-a="confirm"]').click();
    else if(st.done)app.querySelector('[data-a="next"]').click();}
});
render();
})();
</script>
